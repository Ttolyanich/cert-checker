services:
  cert-checker:
    image: ghcr.io/ttolyanich/cert-checker:latest
    build: .
    container_name: cert-checker
    restart: always
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT:-8080}:8000"
    volumes:
      - ${DATA_PATH:-db_data}:/data
    env_file:
      - path: .env
        required: false

volumes:
  db_data:
    name: ${VOLUME_NAME:-cert-checker_db_data}
